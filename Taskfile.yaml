version: "3"

vars:
  LYCHEE_HTTP_ACCEPT: "200..299,498"
  LYCHEE_USER_AGENT: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

tasks:
  run:
    desc: "локальный сервер"
    cmd: hugo server

  run:production:
    desc: "локальный сервер"
    cmd: hugo server --minify --gc --environment production

  build:
    desc: "локальная сборка"
    cmd: hugo --minify --gc
    silent: true

  build:production:
    env:
      SITE_BASE_URL: '{{ .SITE_BASE_URL | default "http://localhost"}}'
    desc: "production: локальная сборка"
    cmd: hugo --minify --gc --environment production --baseURL "$SITE_BASE_URL"
    silent: true

  build:all:
    desc: "мультисборка: основной сайт + городские поддомены в public/"
    env:
      SITE_BASE_URL: '{{ .SITE_BASE_URL | default "http://localhost"}}'
      MEDIA_BASE_URL: '{{ .MEDIA_BASE_URL | default "http://localhost" }}'
    cmd: bash scripts/build.sh public $SITE_BASE_URL
    silent: true

  test:og:all:
    desc: "OG-проверка основного сайта и городов (dist/)"
    deps:
      - build:all
    cmds:
      - python3 scripts/check_og.py dist

  domains:
    desc: "Уникальные домены из alias.stilgrad.md"
    cmd: python3 scripts/list_domains.py -s
    silent: true

  domains:check:
    desc: "Сверка data/cities.yaml с alias.stilgrad.md"
    cmd: python3 scripts/sync_city_domains.py

  clean:
    desc: "Очистка ./public/"
    cmd: rm -rf ./public

  test:html:
    desc: "Проверка внутренних ссылок (lychee), падение при 404"
    deps:
      - build
    cmds:
      - lychee --root-dir public --accept {{.LYCHEE_HTTP_ACCEPT}} --user-agent {{.LYCHEE_USER_AGENT}} public

  test:og:
    desc: "Проверка OG-разметки (og:image, twitter:image) в собранном public/"
    deps:
      - build
    cmds:
      - python3 scripts/check_og.py public

  test:validate:
    desc: "Валидация HTML (html-validate) по собранному public/"
    deps:
      - build
    cmds:
      - npx --yes html-validate@11.21.1 "public/**/*.html"

  docker:build:
    desc: "Docker: финальный образ (nginx + собранный сайт)"
    cmd: docker build -t mrsmargaritach:local .

  docker:run:
    desc: "Docker: собранный сайт в nginx на http://localhost:8080"
    cmds:
      - docker build -t mrsmargaritach:local .
      - docker run --rm -p 8080:80 mrsmargaritach:local

  docker:up:
    desc: "Docker Compose: сайт в nginx (http://localhost:8080)"
    cmd: docker compose up --build

  docker:down:
    desc: "Docker Compose: down"
    cmd: docker compose down

  docker:down:v:
    desc: "Docker Compose: Deleting named volumes"
    cmd: docker compose down -v

  docker:test:
    desc: "Docker: проверки как в ci.yml (сборка, YAML, OG, html-validate)"
    cmd: docker compose run --rm --build test

  docker:test:full:
    desc: "Docker: проверки + Lighthouse и lychee"
    cmd: docker compose run --rm --build -e CHECK_LIGHTHOUSE=1 -e CHECK_LINKS=1 test

  docker:serve:
    desc: "Docker: hugo server с live-reload (http://localhost:1313)"
    cmd: docker compose --profile tools up --build

  docker:shell:
    desc: "Docker: shell с тулчейном (hugo, sass, node, lychee, task)"
    cmd: docker compose run --rm --profile tools --entrypoint bash tools
