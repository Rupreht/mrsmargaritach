version: "3"

vars:
  LYCHEE_HTTP_ACCEPT: "200..299,498"
  LYCHEE_USER_AGENT: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

tasks:
  run:
    desc: "локальный сервер"
    cmd: hugo server

  run:production:
    desc: "локальный сервер"
    cmd: hugo server --minify --gc --environment production

  build:
    desc: "локальная сборка"
    cmd: hugo --minify --gc
    silent: true

  build:production:
    env:
      SITE_BASE_URL: '{{ .SITE_BASE_URL | default "http://localhost"}}'
    desc: "production: локальная сборка"
    cmd: hugo --minify --gc --environment production --baseURL "$SITE_BASE_URL"
    silent: true

  clean:
    desc: "Очистка ./public/"
    cmd: rm -rf ./public

  test:html:
    desc: "Проверка внутренних ссылок (lychee), падение при 404"
    deps:
      - build
    cmds:
      - lychee --root-dir public --accept {{.LYCHEE_HTTP_ACCEPT}} --user-agent {{.LYCHEE_USER_AGENT}} public

  test:og:
    desc: "Проверка OG-разметки (og:image, twitter:image) в собранном public/"
    deps:
      - build
    cmds:
      - python3 scripts/check_og.py public
