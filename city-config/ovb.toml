# Городская сборка: ovb.stilgrad.ru (docs/SEO.md, «Локальная стратегия»).
# Мержится с hugo.toml: hugo --config hugo.toml,city-config/ovb.toml \
#   --contentDir city-content/ovb --destination public/cities/ovb
# baseURL задаёт canonical/og:url/sitemap/robots для этого хоста.
baseURL = "https://ovb.stilgrad.ru/"

[params]
  # Город закрыт от индексации, пока в data/cities.yaml ready: false.
  # После сбора фактов и ready: true — снять (false).
  noindex = true
  cityCode = "ovb"
