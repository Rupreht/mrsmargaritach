# Городская сборка: svx.stilgrad.ru (docs/SEO.md, «Локальная стратегия»).
# Мержится с hugo.toml: hugo --config hugo.toml,city-config/svx.toml \
#   --contentDir city-content/svx --destination public/cities/svx
# baseURL задаёт canonical/og:url/sitemap/robots для этого хоста.
baseURL = "https://svx.stilgrad.ru/"

[params]
  # Город закрыт от индексации, пока в data/cities.yaml ready: false.
  # После сбора фактов и ready: true — снять (false).
  noindex = true
  cityCode = "svx"
