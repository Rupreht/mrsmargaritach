# Городская сборка: mow.stilgrad.ru (docs/SEO.md, «Локальная стратегия»).
# Мержится с hugo.toml: hugo --config hugo.toml,city-config/mow.toml \
#   --contentDir city-content/mow --destination public/cities/mow
# baseURL задаёт canonical/og:url/sitemap/robots для этого хоста.
baseURL = "https://mow.stilgrad.ru/"

[params]
  # Город закрыт от индексации, пока в data/cities.yaml ready: false.
  # После сбора фактов и ready: true — снять (false).
  noindex = true
  cityCode = "mow"
