# Городская сборка: kzn.stilgrad.ru (docs/SEO.md, «Локальная стратегия»).
# Мержится с hugo.toml: hugo --config hugo.toml,city-config/kzn.toml \
#   --contentDir city-content/kzn --destination public/cities/kzn
# baseURL задаёт canonical/og:url/sitemap/robots для этого хоста.
baseURL = "https://kzn.stilgrad.ru/"

[params]
  # Город закрыт от индексации, пока в data/cities.yaml ready: false.
  # После сбора фактов и ready: true — снять (false).
  noindex = true
  cityCode = "kzn"
