# Городская сборка: krd.stilgrad.ru (docs/SEO.md, «Локальная стратегия»).
# Канонический хост города — «Основной домен» из alias.stilgrad.md; домены по
# IATA и человекочитаемые отдают на него 301 (deploy/nginx.conf).
# Мержится с hugo.toml: hugo --config hugo.toml,city-config/krd.toml \
#   --contentDir city-content/krd --destination public/cities/krd
# baseURL задаёт canonical/og:url/sitemap/robots для этого хоста.
baseURL = "https://krd.stilgrad.ru/"

[params]
  # Город закрыт от индексации, пока в data/cities.yaml ready: false.
  # После сбора фактов и ready: true — снять (false).
  noindex = true
  cityCode = "krd"
