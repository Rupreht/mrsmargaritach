# Блок «Как это работает» — три шага.
- title: "Напишите мне"
  text: "Расскажите, какой цвет и размер вам нужны. Можно просто прислать свои мерки."

- title: "Подберём размер и ткань"
  text: "Помогу с размером по меркам и подскажу, как сядет выбранная модель."

- title: "Отшиваем и отправляем"
  text: "Сошью рубашку и отправлю СДЭК или передам при самовывозе в Екатеринбурге."
