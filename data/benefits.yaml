# Блок «Быстрые преимущества» на главной (блок 2, docs/implementation_plan.md, п. 2.3).
- title: "Посадка при колебаниях веса"
  text: "Одно выверенное лекало: рубашка садится красиво и на размер больше, и на размер меньше."

- title: "Утро без головной боли"
  text: "Один низ плюс рубашка. Цвет — под настроение, и образ готов."

- title: "Ткани, приятные к телу"
  text: "Натуральные и смесовые ткани, аккуратный пошив, не просвечивают."

- title: "Личный контакт"
  text: "Вы общаетесь напрямую с автором бренда: помогу с размером и отвечу на вопросы."
