# Размерная сетка (FR-4, FR-6).
#
# Источник значений — `sizes.png` (сетка владелицы). В таблице указан
# ПОЛУОБХВАТ в см, поэтому здесь те же числа: грудь / талия / бёдра —
# полуобхват, а не полный обхват.
#
# bust / waist / hips — вилка полуобхвата: значение из `sizes.png` ±1 см
# для размеров 50–60 и ±2 см для 62-го и больше, потому что крой свободный,
# а лекало гуляет на эти сантиметры.
#
# length — длина по спинке, sleeve — длина рукава, см (рукава в `sizes.png` нет).
# intl — международный аналог: одна ступень на каждый размер
# (50 → XL, 52 → XXL, 54 → 3XL … 72 → 12XL).
#
# Строка 72 — расчётная: в `sizes.png` сетка заканчивается на 70-м,
# для 72-го сохранён шаг сетки 2 см, чтобы не выпасть из диапазона 50–72.

- ru: "50"
  intl: "XL"
  bust: [65, 67]
  waist: [64, 66]
  hips: [65, 67]
  length: 77
  sleeve: 60
  notes: "свободная посадка"

