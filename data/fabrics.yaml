# Типы ткани для блока «Ткани и качество» на главной и карточки модели
# (docs/implementation_plan.md, п. 2.3 блок 7 и 2.5.5).
#
# Проценты пишутся слитно с числом: 50%, 97%, 100%.
# Сезонные ткани отдельными карточками не описываются: у таких моделей
# заполняется только строка fabric в front matter.

- id: mixed
  title: "Смесовая ткань"
  composition: "50% хлопок, 50% полиэстер"
  feel: "Лёгкая, гладкая, немного прохладная на ощупь. Она очень практичная: почти не мнётся, быстро сохнет и отлично держит форму после стирок."
  care: "Не требует пристального ухода, но при этом дышит. Отпаривается отпаривателем за 2–3 минуты."
  purpose: "Идеальный вариант на каждый день, для работы и поездок. Если вы не любите гладить или у вас нет на это времени — это ваш выбор."
  order: 1

- id: cotton
  title: "Ткань с высоким содержанием хлопка"
  composition: "97% хлопок, 3% эластан"
  feel: "Мягкая, дышащая и очень приятная к телу. Благодаря эластану она лучше садится по фигуре и не сковывает движения."
  care: "Как и любая натуральная ткань, требует глажки после стирки. Зато дарит ощущение настоящего комфорта и «дышит» гораздо лучше, чем смесовые варианты."
  purpose: "Для тех, кто ценит натуральность и готов уделить время на глажку."
  order: 2

- id: muslin
  title: "Двухслойный муслин"
  composition: "100% хлопок"
  feel: "Невероятно нежная, воздушная и «живая» ткань. Два слоя тончайшего хлопка создают эффект лёгкого облака: она почти невесома, прекрасно пропускает воздух и дарит ощущение прохлады. В ней комфортно в любое время года — летом она спасает от жары, а в прохладную погоду создаёт ощущение уюта."
  care: "Самая неприхотливая ткань в ассортименте: муслин не нужно гладить — он красиво выглядит в своей естественной, слегка мятой фактуре. Достаточно постирать и высушить."
  purpose: "Для тех, кто ценит свободу и естественность. Это «одежда для души» — в ней хочется гулять, отдыхать и просто наслаждаться жизнью."
  order: 3
