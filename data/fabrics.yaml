# Типы ткани для блока «Ткани и качество» на главной и карточки модели
# (docs/implementation_plan.md, п. 2.3 блок 7 и 2.5.5).
#
# Проценты пишутся слитно с числом: 97%, 100%. Если процентное соотношение
# не указывается, волокна перечисляются через запятую: «хлопок, полиэстер, эластан».
# Необязательное поле subtitle выводится под названием ткани в карточке.
# Сезонные ткани отдельными карточками не описываются: у таких моделей
# заполняется только строка fabric в front matter.

- id: mixed
  title: "Смесовая ткань"
  composition: "хлопок, полиэстер, эластан"
  feel: "Лёгкая, гладкая, немного прохладная на ощупь. Она очень практичная: почти не мнётся, быстро сохнет и отлично держит форму после стирок."
  operation: "Не требует пристального ухода, но при этом дышит. Отпаривается отпаривателем за 2–3 минуты."
  purpose: "Идеальный вариант на каждый день, для работы и поездок. Если вы не любите гладить или у вас нет на это времени — это ваш выбор."
  order: 1
  density: "125 г/м²"
  om_rules: ""

- id: cotton
  title: "Ткань с высоким содержанием хлопка"
  composition: "97% хлопок, 3% эластан"
  feel: "Мягкая, дышащая и очень приятная к телу. Благодаря эластану она лучше садится по фигуре и не сковывает движения."
  operation: "Как и любая натуральная ткань, требует глажки после стирки. Зато дарит ощущение настоящего комфорта и «дышит» гораздо лучше, чем смесовые варианты."
  purpose: "Для тех, кто ценит натуральность и готов уделить время на глажку."
  order: 2
  density: "130 г/м²"
  om_rules: "Стирка 30°C, без отжима, глажка при 110°C"

- id: muslin
  title: "Двухслойный муслин"
  subtitle: "Лёгкое дыхание каждый день"
  composition: "100% хлопок"
  feel: "Это ткань, которая дарит ощущение свободы. Два тонких слоя натурального хлопка создают эффект лёгкого облака — она почти невесома, прекрасно пропускает воздух и дарит прохладу даже в самый жаркий день. В ней комфортно в любое время года: летом она спасает от зноя, а в прохладную погоду создаёт ощущение уюта."
  operation: "И это настоящий подарок для тех, кто ценит естественность. Муслин не нужно гладить — он красиво выглядит в своей слегка мятой фактуре. Достаточно постирать и высушить — и вещь готова к носке."
  purpose: "Воздушная, нежная и «живая» — та самая рубашка, в которой хочется гулять, отдыхать и просто наслаждаться жизнью."
  order: 3
  density: "125 г/м²"
  om_rules: |
    cтирка до 40°C, запрещен хлор и агрессивные отбеливатели.
    Нельзя сильно выкручивать вручную, сушить на батарее или под прямым солнцем.
    Не гладить на высоких температурах с лицевой стороны.
