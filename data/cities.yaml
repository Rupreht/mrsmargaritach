# Городские лендинги (поддомены IATA) — docs/SEO.md, раздел «Локальная стратегия».
#
# Правила (железные):
#   ready: false — контент не проверен: поддомен поднят, но страница закрыта от
#   индексации (noindex наследуется), в переключателе городов не появляется.
#   Публиковать (ready: true) можно только после сбора фактов: конкретные ПВЗ
#   СДЭК с примерочной (name/address/hours), реальные сроки и стоимость доставки,
#   отзывы клиенток с consent: true. Тексты страниц не обязаны быть одинаковыми:
#   у каждого города свои ПВЗ и своя история.
#
# Поля:
#   code       — код IATA (будущий поддомен): mow, led, kzn, svx, ovb
#   aliases    — «человеческие» сокращения для 301-редиректов
#   name       — город в именительном падеже
#   name_in    — «в <городе>» (предложный)
#   name_to    — «в <город>»  (винительный, для «доставка в …»)
#   delivery_days / delivery_cost — реальные сроки и стоимость доставки в город
#   fitting_note — как проходит примерка (из договора СДЭК)
#   pickup_points — конкретные ПВЗ СДЭК с примерочной; пусто — скрываются
#   prefill    — текст заготовки сообщения
#   seo.title / seo.description — метатеги лендинга
#   ready      — можно публиковать (см. правило выше)

- code: svx
  aliases: ["ekb"]
  name: "Екатеринбург"
  name_in: "в Екатеринбурге"
  name_to: "в Екатеринбург"
  delivery_days: "1–2 дня"
  delivery_cost: "по тарифу СДЭК, точную стоимость называю при оформлении"
  fitting_note: "Примерка при получении в пункте выдачи СДЭК: посылку можно вскрыть и примерить, частичный выкуп — забираете только то, что подошло. Оплата — наложенный платёж или онлайн."
  pickup_points:
    - name: "Пункт самовывоза автора бренда"
      address: "Екатеринбург, Сахарова 29/4"
      hours: "по договорённости"
  prefill: "Здравствуйте, Маргарита! Пишу с сайта, интересуюсь доставкой в Екатеринбург."
  seo:
    title: "Рубашки больших размеров с примеркой в Екатеринбурге — Маргарита Чистова"
    description: "Женские рубашки 50–72 с примеркой в ПВЗ СДЭК и самовывозом в Екатеринбурге (Сахарова 29/4). Свободный крой, качественные ткани, заказ в личном диалоге."
  # Подборка моделей на городской странице «Каталог» — ссылки на карточки основного домена.
  # title/price/color_hex дублируют карточку, потому что в городской сборке
  # (contentDir = city-content/<code>) моделей нет. При смене цены в карточке
  # обновите значение и здесь.
  featured:
    - collection: "classic"
      slug: "onyx"
      title: "Рубашка «Оникс»"
      price: 5200
      color_hex: "#17171A"
    - collection: "classic"
      slug: "iceberg"
      title: "Рубашка «Айсберг»"
      price: 5200
      color_hex: "#F1F5F8"
    - collection: "long"
      slug: "flat-white"
      title: "Рубашка «Флэт Уайт»"
      price: 5600
      color_hex: "#F4EBDC"
  ready: false

