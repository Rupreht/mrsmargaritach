name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: "0.169.0"
          extended: true

      - name: Build
        run: hugo --minify --gc --environment production

      - name: Проверка обязательных полей моделей
        run: |
          python3 - <<'PY'
          import sys, pathlib, re
          errors = []
          for path in pathlib.Path("content/catalog").glob("*/index.md"):
              text = path.read_text(encoding="utf-8")
              for field in ("price:", "sizes:", "images:", "alt:"):
                  if field not in text:
                      errors.append(f"{path}: нет поля {field}")
          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print("Обязательные поля на месте")
          PY

      - name: Проверка внутренних ссылок и HTML
        run: |
          # TODO: подключить lychee и html-validate (п. 2.10). Пока — базовая проверка сборки.
          test -f public/index.html
          test -f public/404.html
          test -f public/sitemap.xml

      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: "--root-dir public --accept '200..299,498' --cache --max-cache-age 1d public"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: public
