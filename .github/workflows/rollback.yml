name: rollback

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Имя релиза (папка в releases/, формат ГГГГММДДЧЧММСС). Пусто — предыдущий релиз."
        required: false
        default: ""

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  RELEASES_DIR: /var/www/mrsmargaritach/releases
  CURRENT_LINK: /var/www/mrsmargaritach/current

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Проверка имени релиза
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          if [ -n "$RELEASE" ] && ! printf '%s' "$RELEASE" | grep -Eq '^[0-9]{14}$'; then
            echo "Неверное имя релиза: $RELEASE (ожидается 14 цифр)"
            exit 1
          fi

      - name: Setup known_hosts
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/known_hosts

      - name: Setup SSH
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Switch symlink to previous (or given) release
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          ssh "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "
            set -e
            TARGET='$RELEASE'
            if [ -z \"\$TARGET\" ]; then
              TARGET=\$(ls -1dt '${{ env.RELEASES_DIR }}'/*/ | sed -n 2p | xargs -n1 basename)
            fi
            test -n \"\$TARGET\" || { echo 'Нет релиза для отката'; exit 1; }
            test -d '${{ env.RELEASES_DIR }}'/\$TARGET || { echo \"Релиз \$TARGET не найден\"; exit 1; }
            ln -sfn '${{ env.RELEASES_DIR }}'/\$TARGET '${{ env.CURRENT_LINK }}'
            readlink '${{ env.CURRENT_LINK }}'
          "

      - name: Reload nginx
        run: |
          ssh "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "nginx -s reload"
