name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: dart sass
        uses: dw-labs-org/dart-sass-gha@d5c4c43545a79eaaa11cb4ec8363462702346184 # v1.0.1

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: "0.169.0"
          extended: true

      - name: Build
        run: |
          hugo env
          hugo --minify --gc --environment production

      - name: Проверка YAML и front matter
        run: |
          python3 -m venv /tmp/venv
          . /tmp/venv/bin/activate
          pip install --quiet --disable-pip-version-check yamllint pyyaml
          yamllint -d "{extends: relaxed, rules: {line-length: disable}}" data/
          python3 - <<'PY'
          import pathlib
          import sys

          import yaml

          errors = []
          for path in sorted(pathlib.Path("content").rglob("*.md")):
              text = path.read_text(encoding="utf-8")
              if not text.startswith("---"):
                  continue
              parts = text.split("---", 2)
              if len(parts) < 3:
                  errors.append(f"{path}: незакрытый front matter")
                  continue
              try:
                  yaml.safe_load(parts[1])
              except yaml.YAMLError as exc:
                  errors.append(f"{path}: {exc}")
          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print("YAML и front matter валидны")
          PY

      - name: Проверка обязательных полей моделей
        run: |
          python3 - <<'PY'
          import sys, pathlib, re
          errors = []
          for path in pathlib.Path("content/catalog").glob("*/*/index.md"):
              text = path.read_text(encoding="utf-8")
              for field in ("price:", "sizes:", "images:", "alt:"):
                  if field not in text:
                      errors.append(f"{path}: нет поля {field}")
          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print("Обязательные поля на месте")
          PY

      - name: Open Graph
        run: python3 scripts/check_og.py public

      - name: HTML-validate
        # TODO: убрать continue-on-error после первого зелёного прогона (п. 2.10).
        continue-on-error: true
        run: npx --yes html-validate@9 "public/**/*.html"

      - name: Lighthouse CI
        # Главная, каталог и карточка модели (п. 2.10, 2.11). Конфиг — lighthouserc.json.
        # Пока не блокирует сборку: на noindex-сайте SEO-аудит Lighthouse заведомо ниже цели.
        continue-on-error: true
        run: npx --yes @lhci/cli@0.14.0 autorun

      - name: Проверка результата сборки
        run: |
          # Базовая проверка: ключевые файлы на месте (ссылки проверяет lychee ниже).
          set -e
          test -f public/index.html
          test -f public/404.html
          test -f public/sitemap.xml
          test -f public/favicon.svg
          test -f public/.htaccess
          test -f public/robots.txt

      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: "--root-dir public --accept '200..299,498' --cache --max-cache-age 1d public"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: public

  deploy:
    name: "Deploy"
    needs: ci
    if: github.ref_name == github.event.repository.default_branch
    uses: ./.github/workflows/deploy.yml
