name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: dart sass
        uses: dw-labs-org/dart-sass-gha@d5c4c43545a79eaaa11cb4ec8363462702346184 # v1.0.1

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@d1c81a15d4e6dca7086a17b9c2565cb70fd576bf # v3.3.0
        with:
          hugo-version: "0.170.1"
          extended: true

      - name: Build
        # Мультисборка: public/ — основной сайт, public/cities/<code>/ — города.
        run: |
          hugo env
          bash scripts/build.sh public

      - name: Проверка YAML и front matter
        run: |
          python3 -m venv /tmp/venv
          . /tmp/venv/bin/activate
          pip install --quiet --disable-pip-version-check yamllint pyyaml
          yamllint -d "{extends: relaxed, rules: {line-length: disable}}" data/
          python3 - <<'PY'
          import pathlib
          import sys

          import yaml

          errors = []
          for path in sorted(pathlib.Path("content").rglob("*.md")):
              text = path.read_text(encoding="utf-8")
              if not text.startswith("---"):
                  continue
              parts = text.split("---", 2)
              if len(parts) < 3:
                  errors.append(f"{path}: незакрытый front matter")
                  continue
              try:
                  yaml.safe_load(parts[1])
              except yaml.YAMLError as exc:
                  errors.append(f"{path}: {exc}")
          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print("YAML и front matter валидны")
          PY

      - name: Проверка обязательных полей моделей
        run: |
          python3 - <<'PY'
          import sys, pathlib, re
          errors = []
          for path in pathlib.Path("content/catalog").glob("*/*/index.md"):
              text = path.read_text(encoding="utf-8")
              for field in ("price:", "sizes:", "images:", "alt:"):
                  if field not in text:
                      errors.append(f"{path}: нет поля {field}")
          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print("Обязательные поля на месте")
          PY

      - name: Проверка городских данных и сборок
        run: |
          python3 - <<'PY'
          import pathlib, sys, yaml

          errors = []
          cities = yaml.safe_load(pathlib.Path("data/cities.yaml").read_text(encoding="utf-8"))
          required = ("code", "name", "name_in", "name_to", "prefill", "seo")
          seen_codes, seen_aliases = set(), set()
          for city in cities:
              code = city.get("code", "")
              for field in required:
                  if not city.get(field):
                      errors.append(f"{code or '?'}: нет поля {field}")
              # ready — обязательный булев флаг; false означает «не публиковать».
              if "ready" not in city or not isinstance(city["ready"], bool):
                  errors.append(f"{code or '?'}: нет булева поля ready")
              if code in seen_codes:
                  errors.append(f"{code}: код повторяется")
              seen_codes.add(code)
              for alias in city.get("aliases") or []:
                  if alias in seen_aliases:
                      errors.append(f"{alias}: алиас повторяется")
                  seen_aliases.add(alias)
              for suffix in ("seo.title", "seo.description"):
                  section, key = suffix.split(".")
                  if not (city.get(section) or {}).get(key):
                      errors.append(f"{code}: нет {suffix}")
              if not pathlib.Path(f"city-config/{code}.toml").is_file():
                  errors.append(f"{code}: нет city-config/{code}.toml")
              if not pathlib.Path(f"city-content/{code}/_index.md").is_file():
                  errors.append(f"{code}: нет city-content/{code}/_index.md")

          # Front matter городского контента (лежит вне content/, общий чек его не видит).
          for path in sorted(pathlib.Path("city-content").rglob("*.md")):
              text = path.read_text(encoding="utf-8")
              parts = text.split("---", 2)
              if len(parts) < 3:
                  errors.append(f"{path}: незакрытый front matter")
                  continue
              try:
                  yaml.safe_load(parts[1])
              except yaml.YAMLError as exc:
                  errors.append(f"{path}: {exc}")

          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print(f"Города: {len(cities)} — поля и конфиги на месте")
          PY
          # Домены сверяются с alias.stilgrad.md: code — «Основной домен»,
          # aliases — «Домен по IATA» + «Человекочитаемый домен».
          python3 scripts/sync_city_domains.py
          for code in $(python3 scripts/list_domains.py --column main --domain stilgrad.ru); do
            test -f "public/cities/$code/index.html"
            test -f "public/cities/$code/sitemap.xml"
            test -f "public/cities/$code/robots.txt"
            # Идентичные ассеты — симлинки на копию основного сайта (без дублей).
            for asset in css js photo favicon.svg .htaccess; do
              test -L "public/cities/$code/$asset"
              test -e "public/cities/$code/$asset"
            done
          done
          echo "Городские сборки на месте"

      - name: Open Graph
        run: python3 scripts/check_og.py public

      - name: HTML-validate
        env:
          # Тише вывод npm при установке пакета в кэш раннера; ошибки npm остаются в логе.
          npm_config_loglevel: error
        run: |
          # Явный список файлов: пустой глоб больше не даёт молчаливый зелёный результат.
          COUNT=$(find public -type f -name '*.html' | wc -l | tr -d ' ')
          if [ "$COUNT" -eq 0 ]; then
            echo "HTML-validate: в public/ нет HTML-файлов"
            exit 1
          fi
          find public -type f -name '*.html' -print0 | xargs -0 npx --yes html-validate@11.21.1
          echo "HTML-validate: $COUNT страниц, ошибок нет"

      - name: Lighthouse CI
        # Главная, корень каталога и по одной карточке из каждой коллекции (п. 2.10, 2.11).
        # Список URL строит .lighthouserc.cjs из public/ — модели добавляются и переименовываются
        # без правки конфига. Полный обход всех страниц: LHCI_ALL_PAGES=1 npx @lhci/cli autorun.
        # Аудиты is-on-https и redirects-http пропущены: в CI сайт отдаётся по http://localhost.
        # Пока не блокирует сборку: на noindex-сайте SEO-аудит Lighthouse заведомо ниже цели.
        run: npx --yes @lhci/cli@0.16.x autorun

      - name: Проверка результата сборки
        run: |
          # Базовая проверка: ключевые файлы на месте.
          # Ссылки здесь не проверяются: lychee ходит по внешним адресам
          # (включая городские поддомены), которые отвечают только после деплоя.
          # Полная проверка ссылок — ручной workflow links.yml.
          set -e
          test -f public/index.html
          test -f public/404.html
          test -f public/sitemap.xml
          test -f public/favicon.svg
          test -f public/.htaccess
          test -f public/robots.txt

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: public
