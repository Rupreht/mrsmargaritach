name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: dart sass
        uses: dw-labs-org/dart-sass-gha@d5c4c43545a79eaaa11cb4ec8363462702346184 # v1.0.1

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@d1c81a15d4e6dca7086a17b9c2565cb70fd576bf # v3.3.0
        with:
          hugo-version: "0.170.1"
          extended: true

      - name: Build
        run: |
          hugo env
          hugo --minify --gc --environment production

      - name: Проверка YAML и front matter
        run: |
          python3 -m venv /tmp/venv
          . /tmp/venv/bin/activate
          pip install --quiet --disable-pip-version-check yamllint pyyaml
          yamllint -d "{extends: relaxed, rules: {line-length: disable}}" data/
          python3 - <<'PY'
          import pathlib
          import sys

          import yaml

          errors = []
          for path in sorted(pathlib.Path("content").rglob("*.md")):
              text = path.read_text(encoding="utf-8")
              if not text.startswith("---"):
                  continue
              parts = text.split("---", 2)
              if len(parts) < 3:
                  errors.append(f"{path}: незакрытый front matter")
                  continue
              try:
                  yaml.safe_load(parts[1])
              except yaml.YAMLError as exc:
                  errors.append(f"{path}: {exc}")
          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print("YAML и front matter валидны")
          PY

      - name: Проверка обязательных полей моделей
        run: |
          python3 - <<'PY'
          import sys, pathlib, re
          errors = []
          for path in pathlib.Path("content/catalog").glob("*/*/index.md"):
              text = path.read_text(encoding="utf-8")
              for field in ("price:", "sizes:", "images:", "alt:"):
                  if field not in text:
                      errors.append(f"{path}: нет поля {field}")
          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print("Обязательные поля на месте")
          PY

      - name: Open Graph
        run: python3 scripts/check_og.py public

      - name: HTML-validate
        env:
          # Тише вывод npm при установке пакета в кэш раннера; ошибки npm остаются в логе.
          npm_config_loglevel: error
        run: |
          # Явный список файлов: пустой глоб больше не даёт молчаливый зелёный результат.
          COUNT=$(find public -type f -name '*.html' | wc -l | tr -d ' ')
          if [ "$COUNT" -eq 0 ]; then
            echo "HTML-validate: в public/ нет HTML-файлов"
            exit 1
          fi
          find public -type f -name '*.html' -print0 | xargs -0 npx --yes html-validate@11.21.1
          echo "HTML-validate: $COUNT страниц, ошибок нет"

      - name: Lighthouse CI
        # Главная, корень каталога и по одной карточке из каждой коллекции (п. 2.10, 2.11).
        # Список URL строит .lighthouserc.cjs из public/ — модели добавляются и переименовываются
        # без правки конфига. Полный обход всех страниц: LHCI_ALL_PAGES=1 npx @lhci/cli autorun.
        # Аудиты is-on-https и redirects-http пропущены: в CI сайт отдаётся по http://localhost.
        # Пока не блокирует сборку: на noindex-сайте SEO-аудит Lighthouse заведомо ниже цели.
        run: npx --yes @lhci/cli@0.16.x autorun

      - name: Проверка результата сборки
        run: |
          # Базовая проверка: ключевые файлы на месте (ссылки проверяет lychee ниже).
          set -e
          test -f public/index.html
          test -f public/404.html
          test -f public/sitemap.xml
          test -f public/favicon.svg
          test -f public/.htaccess
          test -f public/robots.txt

      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: "--root-dir public --accept '200..299,498' --cache --max-cache-age 1d public"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: public
