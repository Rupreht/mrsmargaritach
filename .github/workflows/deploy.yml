name: deploy

on:
  # Деплой запускается только после успешного прогона ci на main
  # (двухступенчатая схема, без вызова deploy из ci.yml).
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  # GitHub НЕ будет отменять текущий запущенный деплой.
  # Новая сборка просто встанет в очередь (в статус pending)
  # и будет ждать завершения предыдущей
  cancel-in-progress: false

env:
  # Один релиз раскладывается на все виртуальные хосты: основной сайт, города
  # и CDN (медиа + cities.json). Список городов scripts/deploy.sh берёт из
  # alias.stilgrad.md.
  KEEP_RELEASES: 5

jobs:
  deploy:
    # Только реальный push в main с зелёным ci либо ручной запуск.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: dart sass
        uses: dw-labs-org/dart-sass-gha@d5c4c43545a79eaaa11cb4ec8363462702346184 # v1.0.1

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@d1c81a15d4e6dca7086a17b9c2565cb70fd576bf # v3.3.0
        with:
          hugo-version: "0.170.1"
          extended: true

      - name: Build
        # Мультисборка: dist/ — основной сайт, dist/cities/<code>/ — города
        # (с полным каталогом, одинаковая структура), dist/cdn/ — медиа и cities.json.
        # MEDIA_BASE_URL — база CDN: медиа генерируется один раз и деплоится
        # только на cdn.<домен>; страницы ссылаются на него абсолютными URL.
        env:
          MEDIA_BASE_URL: ${{ vars.CDN_BASE_URL }}
        run: bash scripts/build.sh dist "${{ vars.SITE_BASE_URL }}"

      - name: Setup known_hosts
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/known_hosts

      - name: Setup SSH
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Deploy release to all virtual hosts
        # Раскладка по хостам: <host>/releases/<RELEASE> + www -> releases/<RELEASE>,
        # prune старых релизов и touch <host>/reload. Логика — в scripts/deploy.sh.
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          CDN_HOST: ${{ vars.CDN_HOST }}
        run: |
          RELEASE=$(date -u +%Y%m%d%H%M%S)
          bash scripts/deploy.sh "$RELEASE" dist
