name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  # GitHub НЕ будет отменять текущий запущенный деплой.
  # Новая сборка просто встанет в очередь (в статус pending)
  # и будет ждать завершения предыдущей
  cancel-in-progress: false

env:
  RELEASES_DIR: shirt.e365.ru/releases
  CURRENT_LINK: shirt.e365.ru/www
  KEEP_RELEASES: 5

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: "0.169.0"
          extended: true

      - name: Build
        run: hugo --minify --gc --environment production --baseURL "${{ vars.SITE_BASE_URL }}"

      - name: Setup known_hosts
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/known_hosts

      - name: Setup SSH
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Upload release
        run: |
          RELEASE=$(date -u +%Y%m%d%H%M%S)
          echo "RELEASE=$RELEASE" >> "$GITHUB_ENV"
          echo "PRUNE_FROM=$(( ${{ env.KEEP_RELEASES }} + 1 ))" >> "$GITHUB_ENV"
          rsync -az --delete public/ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.RELEASES_DIR }}/$RELEASE/"

      - name: Switch symlink and prune old releases
        run: |
          ssh "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "
            set -e
            ln -sfn 'releases/${{ env.RELEASE }}' '${{ env.CURRENT_LINK }}'
            ls -1dt '${{ env.RELEASES_DIR }}'/*/ | tail -n +${{ env.PRUNE_FROM }} | xargs -r rm -rf
            readlink '${{ env.CURRENT_LINK }}'
          "

      - name: Reload nginx
        # Деплой-пользователю нужно право перезагрузить nginx без пароля
        # (sudoers-правило на `nginx -s reload` или `systemctl reload nginx`).
        run: |
          ssh "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "touch shirt.e365.ru/reload"
