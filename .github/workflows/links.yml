name: Links

# Ручная проверка ссылок. Lychee ходит по внешним адресам из сборки — контакты,
# маркетплейсы и городские поддомены *.stilgrad.ru, — а они отвечают только
# после деплоя. Поэтому проверка вынесена из ci.yml (push/PR) сюда: запуск
# вручную через Actions → Links → Run workflow (или repository_dispatch),
# плюс ночной прогон по расписанию. Сборка не блокируется: отчёт уходит в issue.
on:
  repository_dispatch:
  workflow_dispatch:
  schedule:
    - cron: "00 18 * * *"

jobs:
  linkChecker:
    runs-on: ubuntu-latest
    permissions:
      issues: write # required for peter-evans/create-issue-from-file
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: dart sass
        uses: dw-labs-org/dart-sass-gha@d5c4c43545a79eaaa11cb4ec8363462702346184 # v1.0.1

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@d1c81a15d4e6dca7086a17b9c2565cb70fd576bf # v3.3.0
        with:
          hugo-version: "0.170.1"
          extended: true

      - name: Build
        # Мультисборка: основной сайт + городские поддомены.
        run: bash scripts/build.sh public

      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # --root-dir: внутренние ссылки проверяются по локальной сборке,
          # внешние — реальными запросами к уже развёрнутым доменам.
          args: "--root-dir public --accept '200..299,498' public"
          fail: false

      - name: Create Issue From File
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # sv6.0.0
        with:
          title: Link Checker Report
          content-filepath: ./lychee/out.md
          labels: report, automated issue
