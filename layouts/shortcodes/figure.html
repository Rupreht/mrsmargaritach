{{- $src := .Get "src" -}}
{{- $alt := .Get "alt" | default "" -}}
{{- $caption := .Get "caption" -}}
{{- with .Page.Resources.GetMatch $src }}
<figure class="figure">
  {{ partial "responsive-img.html" (dict "img" . "sizes" "(max-width: 719px) 100vw, 720px" "alt" $alt) }}
  {{- with $caption }}<figcaption class="figure__caption">{{ . }}</figcaption>{{ end }}
</figure>
{{- else }}
<figure class="figure figure--empty">
  <span class="figure__placeholder">{{ $alt }}</span>
</figure>
{{- end }}
