# nginx для контейнера с собранным сайтом (Dockerfile, стадия nginx).
#
# Отличия от боевого deploy/nginx.conf:
#   * только HTTP (80): TLS терминируется хостом/прокси перед контейнером;
#   * root — /usr/share/nginx/html, куда копируется dist/ (основной сайт +
#     cities/<code>/), а не симлинк /var/www/mrsmargaritach/current;
#   * идентичные ассеты городов — относительные симлинки на копию основного
#     сайта (../../css и т. п.); Docker COPY сохраняет симлинки, nginx их
#     разыменовывает по умолчанию (disable_symlinks off);
#   * нет принудительного редиректа на https — локальное превью работает
#     по http://localhost:8080/;
#   * схема в 301 берётся из X-Forwarded-Proto, если контейнер стоит за прокси.
#
# Логика хостов та же: map $host $city_dir подставляет подкаталог городской
# сборки, алиасы (домен по IATA + человекочитаемый) отдают 301 на канонический
# хост города. Источник доменов — alias.stilgrad.md; сверка —
# python3 scripts/sync_city_domains.py.

# Хост → подкаталог городской сборки.
map $host $city_dir {
    default              "";
    moscow.stilgrad.ru   "cities/moscow";
    spb.stilgrad.ru      "cities/spb";
    nsk.stilgrad.ru      "cities/nsk";
    ekb.stilgrad.ru      "cities/ekb";
    kazan.stilgrad.ru    "cities/kazan";
    krsk.stilgrad.ru     "cities/krsk";
    nn.stilgrad.ru       "cities/nn";
    chel.stilgrad.ru     "cities/chel";
    ufa.stilgrad.ru      "cities/ufa";
    krd.stilgrad.ru      "cities/krd";
    samara.stilgrad.ru   "cities/samara";
    rostov.stilgrad.ru   "cities/rostov";
    omsk.stilgrad.ru     "cities/omsk";
    voronezh.stilgrad.ru "cities/voronezh";
    perm.stilgrad.ru     "cities/perm";
    vlg.stilgrad.ru      "cities/vlg";
}

# Алиас → канонический хост города.
map $host $city_canonical {
    default                       "";
    mow.stilgrad.ru               "moscow.stilgrad.ru";
    msk.stilgrad.ru               "moscow.stilgrad.ru";
    led.stilgrad.ru               "spb.stilgrad.ru";
    saint-petersburg.stilgrad.ru  "spb.stilgrad.ru";
    ovb.stilgrad.ru               "nsk.stilgrad.ru";
    novosibirsk.stilgrad.ru       "nsk.stilgrad.ru";
    svx.stilgrad.ru               "ekb.stilgrad.ru";
    ekaterinburg.stilgrad.ru      "ekb.stilgrad.ru";
    kzn.stilgrad.ru               "kazan.stilgrad.ru";
    kja.stilgrad.ru               "krsk.stilgrad.ru";
    krasnoyarsk.stilgrad.ru       "krsk.stilgrad.ru";
    goj.stilgrad.ru               "nn.stilgrad.ru";
    nizhny-novgorod.stilgrad.ru   "nn.stilgrad.ru";
    cek.stilgrad.ru               "chel.stilgrad.ru";
    chelyabinsk.stilgrad.ru       "chel.stilgrad.ru";
    krr.stilgrad.ru               "krd.stilgrad.ru";
    krasnodar.stilgrad.ru         "krd.stilgrad.ru";
    kuf.stilgrad.ru               "samara.stilgrad.ru";
    rov.stilgrad.ru               "rostov.stilgrad.ru";
    rostov-na-donu.stilgrad.ru    "rostov.stilgrad.ru";
    oms.stilgrad.ru               "omsk.stilgrad.ru";
    voz.stilgrad.ru               "voronezh.stilgrad.ru";
    pee.stilgrad.ru               "perm.stilgrad.ru";
    vog.stilgrad.ru               "vlg.stilgrad.ru";
    volgograd.stilgrad.ru         "vlg.stilgrad.ru";
}

# Схема для редиректов: за прокси берём X-Forwarded-Proto, иначе — текущую.
map $http_x_forwarded_proto $forwarded_scheme {
    default $scheme;
    https   https;
}


# Основной сайт. default_server — чтобы локальные запросы (localhost, 127.0.0.1,
# неизвестный Host) отдавали сборку stilgrad.ru, а не пустую страницу.
server {
    listen 80 default_server;
    server_name stilgrad.ru www.stilgrad.ru localhost _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/site-common.conf;
}

# Алиасы городов → 301 на канонический хост.
server {
    listen 80;
    server_name
        mow.stilgrad.ru msk.stilgrad.ru
        led.stilgrad.ru saint-petersburg.stilgrad.ru
        ovb.stilgrad.ru novosibirsk.stilgrad.ru
        svx.stilgrad.ru ekaterinburg.stilgrad.ru
        kzn.stilgrad.ru
        kja.stilgrad.ru krasnoyarsk.stilgrad.ru
        goj.stilgrad.ru nizhny-novgorod.stilgrad.ru
        cek.stilgrad.ru chelyabinsk.stilgrad.ru
        krr.stilgrad.ru krasnodar.stilgrad.ru
        kuf.stilgrad.ru
        rov.stilgrad.ru rostov-na-donu.stilgrad.ru
        oms.stilgrad.ru
        voz.stilgrad.ru
        pee.stilgrad.ru
        vog.stilgrad.ru volgograd.stilgrad.ru;

    return 301 $forwarded_scheme://$city_canonical$request_uri;
}

# Канонические хосты городов: один server, root подставляется из $city_dir.
server {
    listen 80;
    server_name
        moscow.stilgrad.ru
        spb.stilgrad.ru
        nsk.stilgrad.ru
        ekb.stilgrad.ru
        kazan.stilgrad.ru
        krsk.stilgrad.ru
        nn.stilgrad.ru
        chel.stilgrad.ru
        ufa.stilgrad.ru
        krd.stilgrad.ru
        samara.stilgrad.ru
        rostov.stilgrad.ru
        omsk.stilgrad.ru
        voronezh.stilgrad.ru
        perm.stilgrad.ru
        vlg.stilgrad.ru;

    root /usr/share/nginx/html/$city_dir;
    index index.html;

    include /etc/nginx/snippets/site-common.conf;
}

server_tokens off;
