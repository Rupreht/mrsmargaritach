# Общие настройки серверов: заголовки, gzip, кэш, 404.
# Подключается из docker/nginx.conf в блоки основного сайта и городов
# (include /etc/nginx/snippets/site-common.conf).
# Значения совпадают с боевым deploy/nginx.conf.

charset utf-8;

gzip on;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' https://mc.yandex.ru; connect-src 'self' https://mc.yandex.ru; frame-src https://mc.yandex.ru; base-uri 'self'; form-action 'none'" always;

location / {
    try_files $uri $uri/ =404;
}

# Кастомная 404: без error_page nginx отдаст пустую страницу.
error_page 404 /404.html;

location = /404.html {
    internal;
}

# Хэшированные ассеты можно кэшировать навсегда.
location ~* "^/(css|js|images|fonts)/" {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# HTML — без кэша, чтобы правки контента появлялись сразу.
location ~* \.html$ {
    add_header Cache-Control "no-cache";
}
