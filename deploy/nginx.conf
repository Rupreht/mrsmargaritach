# nginx для статики Hugo (docs/implementation_plan.md, п. 2.7 и 2.10).
# Симлинк /var/www/mrsmargaritach/current указывает на активный релиз.
#
# Структура релиза (scripts/build.sh):
#   current/                — stilgrad.ru (основной сайт)
#   current/cities/mow/     — mow.stilgrad.ru
#   current/cities/led/     — led.stilgrad.ru
#   current/cities/kzn/     — kzn.stilgrad.ru
#   current/cities/svx/     — svx.stilgrad.ru
#   current/cities/ovb/     — ovb.stilgrad.ru
#
# TLS: wildcard *.stilgrad.ru выпускается у хостера (панель NetAngels).
# TODO: подставить пути к fullchain.pem/privkey.pem, которые выдаёт панель.

# Хост → подкаталог городской сборки в релизе.
map $host $city_dir {
    default          "";
    mow.stilgrad.ru  "cities/mow";
    led.stilgrad.ru  "cities/led";
    kzn.stilgrad.ru  "cities/kzn";
    svx.stilgrad.ru  "cities/svx";
    ovb.stilgrad.ru  "cities/ovb";
}

# Алиасы (человеческие сокращения) → канонический IATA-хост.
map $host $city_canonical {
    default          "";
    msk.stilgrad.ru  "mow.stilgrad.ru";
    spb.stilgrad.ru  "led.stilgrad.ru";
    ekb.stilgrad.ru  "svx.stilgrad.ru";
    nsk.stilgrad.ru  "ovb.stilgrad.ru";
}

server {
    listen 80;
    server_name stilgrad.ru www.stilgrad.ru *.stilgrad.ru;
    if ($city_canonical) {
        return 301 https://$city_canonical$request_uri;
    }
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.stilgrad.ru;
    # TODO: сертификат (Let's Encrypt / certbot) и пути к нему.
    ssl_certificate     /etc/letsencrypt/live/stilgrad.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stilgrad.ru/privkey.pem;
    return 301 https://stilgrad.ru$request_uri;
}

server {
    listen 443 ssl http2;
    server_name msk.stilgrad.ru spb.stilgrad.ru ekb.stilgrad.ru nsk.stilgrad.ru;
    ssl_certificate     /etc/letsencrypt/live/stilgrad.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stilgrad.ru/privkey.pem;
    return 301 https://$city_canonical$request_uri;
}

server {
    listen 443 ssl http2;
    server_name stilgrad.ru;

    root /var/www/mrsmargaritach/current;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/stilgrad.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stilgrad.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    charset utf-8;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' https://mc.yandex.ru; connect-src 'self' https://mc.yandex.ru; frame-src https://mc.yandex.ru; base-uri 'self'; form-action 'none'" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Кастомная 404: без error_page nginx отдаст пустую страницу.
    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    # Хэшированные ассеты можно кэшировать навсегда.
    location ~* "^/(css|js|images|fonts)/" {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # HTML — без кэша, чтобы правки контента появлялись сразу.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }
}

# Городские поддомены: один сервер, root подставляется из map $city_dir.
server {
    listen 443 ssl http2;
    server_name mow.stilgrad.ru led.stilgrad.ru kzn.stilgrad.ru svx.stilgrad.ru ovb.stilgrad.ru;

    root /var/www/mrsmargaritach/current/$city_dir;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/stilgrad.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stilgrad.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    charset utf-8;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' https://mc.yandex.ru; connect-src 'self' https://mc.yandex.ru; frame-src https://mc.yandex.ru; base-uri 'self'; form-action 'none'" always;

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    location ~* "^/(css|js|images|fonts)/" {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }
}

# Неизвестный поддомен → основной сайт (exact-совпадения выше имеют приоритет).
server {
    listen 443 ssl http2;
    server_name .stilgrad.ru;
    ssl_certificate     /etc/letsencrypt/live/stilgrad.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stilgrad.ru/privkey.pem;
    return 301 https://stilgrad.ru$request_uri;
}

