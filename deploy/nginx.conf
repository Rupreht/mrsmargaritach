# nginx для статики Hugo (docs/implementation_plan.md, п. 2.7 и 2.10).
# Симлинк /var/www/mrsmargaritach/current указывает на активный релиз.
#
# Структура релиза (scripts/build.sh):
#   current/                — stilgrad.ru (основной сайт)
#   current/cities/<code>/  — канонический поддомен города
#
# Канонические домены городов — колонка «Основной домен» в alias.stilgrad.md;
# домены по IATA и человекочитаемые отдают на них 301 (см. $city_canonical).
# Сверка конфигурации с таблицей: python3 scripts/sync_city_domains.py.
#
# TLS: wildcard *.stilgrad.ru выпускается у хостера (панель NetAngels).
# TODO: подставить пути к fullchain.pem/privkey.pem, которые выдаёт панель.

# Хост → подкаталог городской сборки в релизе.
map $host $city_dir {
    default              "";
    moscow.stilgrad.ru   "cities/moscow";
    spb.stilgrad.ru      "cities/spb";
    nsk.stilgrad.ru      "cities/nsk";
    ekb.stilgrad.ru      "cities/ekb";
    kazan.stilgrad.ru    "cities/kazan";
    krsk.stilgrad.ru     "cities/krsk";
    nn.stilgrad.ru       "cities/nn";
    chel.stilgrad.ru     "cities/chel";
    ufa.stilgrad.ru      "cities/ufa";
    krd.stilgrad.ru      "cities/krd";
    samara.stilgrad.ru   "cities/samara";
    rostov.stilgrad.ru   "cities/rostov";
    omsk.stilgrad.ru     "cities/omsk";
    voronezh.stilgrad.ru "cities/voronezh";
    perm.stilgrad.ru     "cities/perm";
    vlg.stilgrad.ru      "cities/vlg";
}

# Алиасы (домен по IATA + человекочитаемый) → канонический хост города.
map $host $city_canonical {
    default                       "";
    mow.stilgrad.ru               "moscow.stilgrad.ru";
    led.stilgrad.ru               "spb.stilgrad.ru";
    saint-petersburg.stilgrad.ru  "spb.stilgrad.ru";
    ovb.stilgrad.ru               "nsk.stilgrad.ru";
    novosibirsk.stilgrad.ru       "nsk.stilgrad.ru";
    svx.stilgrad.ru               "ekb.stilgrad.ru";
    ekaterinburg.stilgrad.ru      "ekb.stilgrad.ru";
    kzn.stilgrad.ru               "kazan.stilgrad.ru";
    kja.stilgrad.ru               "krsk.stilgrad.ru";
    krasnoyarsk.stilgrad.ru       "krsk.stilgrad.ru";
    goj.stilgrad.ru               "nn.stilgrad.ru";
    nizhny-novgorod.stilgrad.ru   "nn.stilgrad.ru";
    cek.stilgrad.ru               "chel.stilgrad.ru";
    chelyabinsk.stilgrad.ru       "chel.stilgrad.ru";
    krr.stilgrad.ru               "krd.stilgrad.ru";
    krasnodar.stilgrad.ru         "krd.stilgrad.ru";
    kuf.stilgrad.ru               "samara.stilgrad.ru";
    rov.stilgrad.ru               "rostov.stilgrad.ru";
    rostov-na-donu.stilgrad.ru    "rostov.stilgrad.ru";
    oms.stilgrad.ru               "omsk.stilgrad.ru";
    voz.stilgrad.ru               "voronezh.stilgrad.ru";
    pee.stilgrad.ru               "perm.stilgrad.ru";
    vog.stilgrad.ru               "vlg.stilgrad.ru";
    volgograd.stilgrad.ru         "vlg.stilgrad.ru";
}


server {
    listen 80;
    server_name stilgrad.ru www.stilgrad.ru *.stilgrad.ru;
    if ($city_canonical) {
        return 301 https://$city_canonical$request_uri;
    }
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.stilgrad.ru;
    # TODO: сертификат (Let's Encrypt / certbot) и пути к нему.
    ssl_certificate     /etc/letsencrypt/live/stilgrad.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stilgrad.ru/privkey.pem;
    return 301 https://stilgrad.ru$request_uri;
}

server {
    listen 443 ssl http2;
    # Все алиасы из alias.stilgrad.md (домен по IATA + человекочитаемый).
    server_name
        mow.stilgrad.ru
        led.stilgrad.ru saint-petersburg.stilgrad.ru
        ovb.stilgrad.ru novosibirsk.stilgrad.ru
        svx.stilgrad.ru ekaterinburg.stilgrad.ru
        kzn.stilgrad.ru
        kja.stilgrad.ru krasnoyarsk.stilgrad.ru
        goj.stilgrad.ru nizhny-novgorod.stilgrad.ru
        cek.stilgrad.ru chelyabinsk.stilgrad.ru
        krr.stilgrad.ru krasnodar.stilgrad.ru
        kuf.stilgrad.ru
        rov.stilgrad.ru rostov-na-donu.stilgrad.ru
        oms.stilgrad.ru
        voz.stilgrad.ru
        pee.stilgrad.ru
        vog.stilgrad.ru volgograd.stilgrad.ru;
    ssl_certificate     /etc/letsencrypt/live/stilgrad.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stilgrad.ru/privkey.pem;
    return 301 https://$city_canonical$request_uri;
}

server {
    listen 443 ssl http2;
    server_name stilgrad.ru;

    root /var/www/mrsmargaritach/current;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/stilgrad.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stilgrad.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    charset utf-8;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' https://mc.yandex.ru; connect-src 'self' https://mc.yandex.ru; frame-src https://mc.yandex.ru; base-uri 'self'; form-action 'none'" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Кастомная 404: без error_page nginx отдаст пустую страницу.
    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    # Хэшированные ассеты можно кэшировать навсегда.
    location ~* "^/(css|js|images|fonts)/" {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # HTML — без кэша, чтобы правки контента появлялись сразу.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }
}

# Городские поддомены: один сервер, root подставляется из map $city_dir.
server {
    listen 443 ssl http2;
    # Канонические домены городов («Основной домен» в alias.stilgrad.md).
    server_name
        moscow.stilgrad.ru
        spb.stilgrad.ru
        nsk.stilgrad.ru
        ekb.stilgrad.ru
        kazan.stilgrad.ru
        krsk.stilgrad.ru
        nn.stilgrad.ru
        chel.stilgrad.ru
        ufa.stilgrad.ru
        krd.stilgrad.ru
        samara.stilgrad.ru
        rostov.stilgrad.ru
        omsk.stilgrad.ru
        voronezh.stilgrad.ru
        perm.stilgrad.ru
        vlg.stilgrad.ru;

    root /var/www/mrsmargaritach/current/$city_dir;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/stilgrad.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stilgrad.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    charset utf-8;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' https://mc.yandex.ru; connect-src 'self' https://mc.yandex.ru; frame-src https://mc.yandex.ru; base-uri 'self'; form-action 'none'" always;

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    location ~* "^/(css|js|images|fonts)/" {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }
}

# Неизвестный поддомен → основной сайт (exact-совпадения выше имеют приоритет).
server {
    listen 443 ssl http2;
    server_name .stilgrad.ru;
    ssl_certificate     /etc/letsencrypt/live/stilgrad.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stilgrad.ru/privkey.pem;
    return 301 https://stilgrad.ru$request_uri;
}

