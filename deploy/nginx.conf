# nginx для статики Hugo (docs/implementation_plan.md, п. 2.7 и 2.10).
# Симлинк /var/www/mrsmargaritach/current указывает на активный релиз.

server {
    listen 80;
    server_name example.ru www.example.ru;
    return 301 https://example.ru$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.example.ru;
    # TODO: сертификат (Let's Encrypt / certbot) и пути к нему.
    ssl_certificate     /etc/letsencrypt/live/example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.ru/privkey.pem;
    return 301 https://example.ru$request_uri;
}

server {
    listen 443 ssl http2;
    server_name example.ru;

    root /var/www/mrsmargaritach/current;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    charset utf-8;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' https://mc.yandex.ru; connect-src 'self' https://mc.yandex.ru; frame-src https://mc.yandex.ru; base-uri 'self'; form-action 'none'" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /404.html {
        internal;
    }

    # Хэшированные ассеты можно кэшировать навсегда.
    location ~* "^/(css|js|images|fonts)/" {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # HTML — без кэша, чтобы правки контента появлялись сразу.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }
}
