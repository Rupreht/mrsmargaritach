# Конфигурация сайта «Маргарита Чистова».
# Стек: Hugo extended ≥ 0.140, без Node.js. См. docs/implementation_plan.md, п. 2.7.

baseURL = "https://stilgrad.ru/"
locale = "ru-RU"
defaultContentLanguage = "ru"
title = "Маргарита Чистова — рубашки, в которых хорошо"
timeZone = "Asia/Yekaterinburg"
enableRobotsTXT = true

# RSS и таксономии не нужны: контентных потоков на сайте нет.
disableKinds = ["taxonomy", "term", "rss"]

[params]
  brand = "Маргарита Чистова"
  tagline = "Рубашки, в которых хорошо"
  # До запуска сайт закрыт от индексации: meta robots + robots.txt (п. 2.14, риск «нет ОГРНИП»).
  noindex = true
  description = "Женские рубашки больших размеров 50–72: свободный крой, качественные ткани, аккуратный пошив. Подбор размера и заказ — в личном диалоге."
  signature = "С любовью, Маргарита"

  # Реквизиты (docs/implementation_plan.md, п. 3.2). Пустые значения скрываются в шаблоне.
  legalName = "ИП Чистова М. В."
  inn = "665812055864"
  ogrnip = "317665800159760"
  phone = "+7 (912) 226-50-77"
  phoneRaw = "+79122265077"
  city = "Екатеринбург"
  priceCurrency = "RUB"

  # Основной домен: с городских поддоменов ссылки на карточки моделей и
  # юридические документы ведут сюда (docs/SEO.md, «Локальная стратегия»).
  mainBaseURL = "https://stilgrad.ru/"

  # Домен без схемы: из него собираются адреса городских поддоменов
  # (<code>.<domain>) в переключателе городов.
  domain = "stilgrad.ru"

  # Базовый URL CDN для медиа (изображения каталога и hero). Медиа генерируется
  # один раз и деплоится только на CDN-хост (cdn.<domain>); все хосты ссылаются
  # на него абсолютными URL. Пусто — относительные ссылки (локальная разработка).
  # В проде задаётся переменной MEDIA_BASE_URL в scripts/build.sh, например
  # https://cdn.stilgrad.ru/. См. docs/SEO.md, «CDN».
  mediaBaseURL = ""

  # Код города текущей сборки — канонический поддомен из alias.stilgrad.md
  # (колонка «Основной домен»). Пусто на основном сайте; переопределяется
  # в city-config/<code>.toml при сборке городского мини-сайта.
  cityCode = ""

  # Декларация соответствия ТР ТС 017/2011 (docs/implementation_plan.md, п. 3.2 и 3.8).
  # Выводится в футере и на карточке модели; пустые значения скрываются.
  declarationNumber = "ЕАЭС N RU Д-RU.РА10.В.84620/23"
  declarationDate = "28.12.2023"

  # Аналитика: счётчик грузится только после согласия на cookie (п. 2.9).
  metrikaId = "114730476"

  # Глобальный оверрайд OG-превью (он же Organization.logo). Путь в static/ или assets/.
  # Пусто — превью берётся со страницы: og_image → images[0] → ogImageDefault → hero.image.
  ogImage = ""
  # Общее OG-превью 1200×630 для страниц без своих фото: static/og/og-cover.jpg.
  # Файла пока нет — используется hero главной; положите файл, и он подхватится сам.
  ogImageDefault = "og/og-cover.jpg"

[markup]
  [markup.goldmark.renderer]
    # Разрешаем HTML в Markdown: в юридических текстах нужны таблицы и списки.
    unsafe = true
  [markup.goldmark.parser]
    autoHeadingIDType = "github"
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[minify]
  minifyOutput = true
  [minify.tdewolff]
    [minify.tdewolff.html]
      # Запрещает удалять кавычки вокруг атрибутов при минификации
      keepQuotes = true

# Разрешаем шаблонам читать базу CDN из окружения (partials/cdn-url.html).
# Значение задаёт scripts/build.sh (переменная MEDIA_BASE_URL).
[security]
  [security.funcs]
    getenv = ['^HUGO_', '^CI$', '^MEDIA_BASE_URL$']

[[menus.main]]
  name = "Каталог"
  pageRef = "/catalog"
  weight = 10

[[menus.main]]
  name = "О бренде"
  pageRef = "/about"
  weight = 20

[[menus.main]]
  name = "Доставка и возврат"
  pageRef = "/delivery"
  weight = 30

[[menus.main]]
  name = "Вопросы"
  pageRef = "/faq"
  weight = 40
